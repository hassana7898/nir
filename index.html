
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>نرم افزار مدیریت حواله کارخانه</title>
    <style>
        html, body, #root { min-height: 100%; }
        html, body { margin: 0; width: 100%; overflow-x: hidden; }
        button, input, select, textarea { font: inherit; }

        /* NIR mobile foundation: keeps desktop unchanged and adapts the existing UI below 768px. */
        @media (max-width: 767px) {
            body { min-width: 0; }

            #root > div {
                min-height: 100dvh;
            }

            /* Existing sidebar becomes a compact horizontal navigation bar. */
            #root aside {
                width: 100% !important;
                max-width: 100% !important;
                height: auto !important;
                min-height: 0 !important;
                box-sizing: border-box !important;
                padding: 10px !important;
                flex: 0 0 auto !important;
                position: sticky !important;
                top: 0 !important;
                z-index: 100 !important;
                box-shadow: 0 2px 12px rgba(15, 23, 42, .18);
            }

            #root aside > div:first-child {
                font-size: 1.05rem !important;
                margin-bottom: 8px !important;
                padding-bottom: 8px !important;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            #root aside nav {
                display: flex !important;
                flex-direction: row !important;
                gap: 6px !important;
                overflow-x: auto !important;
                overflow-y: hidden !important;
                padding: 2px 0 5px !important;
                scrollbar-width: none;
                -webkit-overflow-scrolling: touch;
            }

            #root aside nav::-webkit-scrollbar { display: none; }

            #root aside nav a {
                flex: 0 0 auto !important;
                min-width: 82px !important;
                margin: 0 !important;
                padding: 8px 10px !important;
                justify-content: center !important;
                flex-direction: column !important;
                gap: 3px !important;
                text-align: center !important;
                font-size: .72rem !important;
                line-height: 1.25 !important;
                white-space: nowrap !important;
            }

            #root aside nav a svg {
                width: 21px !important;
                height: 21px !important;
                margin: 0 !important;
            }

            #root aside > div:last-child {
                display: none !important;
            }

            #root main {
                min-width: 0 !important;
                width: 100% !important;
                box-sizing: border-box !important;
                padding: 12px !important;
                overflow-x: hidden !important;
            }

            /* Prevent common controls from overflowing narrow screens. */
            #root input,
            #root select,
            #root textarea,
            #root button {
                max-width: 100%;
                box-sizing: border-box;
            }

            /* Preserve wide data tables while allowing horizontal touch scrolling. */
            #root table {
                min-width: max-content;
            }

            #root main > div {
                max-width: 100%;
                box-sizing: border-box;
            }

            /* Make common modal/dialog containers fit the viewport. */
            #root [role="dialog"],
            #root .fixed.inset-0 > div,
            #root .fixed.inset-0 > section {
                max-width: calc(100vw - 24px) !important;
                box-sizing: border-box !important;
            }

            /* Larger touch targets for form controls. */
            #root input,
            #root select,
            #root textarea {
                min-height: 42px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <div id="print-root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
